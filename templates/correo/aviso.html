<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ titulo }}</title></head>
<body style="margin:0;padding:0;background:#E9ECEF;font-family:Segoe UI,Arial,sans-serif;color:#212529;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#E9ECEF;padding:24px 12px;">
<tr><td align="center">
  <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#F8F9FA;border:1px solid #CED4DA;border-radius:10px;overflow:hidden;">
    <tr><td style="padding:0;line-height:0;font-size:0;"><img src="cid:aurora" width="560" alt="{{ sistema }}" style="display:block;width:100%;max-width:560px;height:auto;border:0;"></td></tr>
    <tr><td style="background:#343A40;color:#E6EAEE;padding:2px 22px 14px 22px;font-size:16px;font-weight:600;">{{ sistema }}{% if codigo %} <span style="font-weight:400;color:#38BDF8;">· {{ codigo }}</span>{% endif %}</td></tr>
    <tr><td style="padding:22px 22px 6px 22px;">
      <p style="margin:0 0 4px 0;font-size:13px;color:#566069;">Hola {{ nombre }},</p>
      <h1 style="margin:0 0 14px 0;font-size:20px;line-height:1.3;color:#212529;">{{ titulo }}</h1>
      {% for linea in lineas %}<p style="margin:0 0 6px 0;font-size:14px;line-height:1.5;">{{ linea }}</p>{% endfor %}
      {% if cita %}<div style="margin:14px 0 4px 0;padding:10px 14px;background:#FFFFFF;border-left:4px solid #0369A1;border-radius:4px;font-size:14px;line-height:1.5;white-space:pre-wrap;">{{ cita }}</div>{% endif %}
    </td></tr>
    <tr><td style="padding:14px 22px 24px 22px;">
      <a href="{{ enlace }}" style="display:inline-block;background:#0369A1;color:#FFFFFF;text-decoration:none;font-size:14px;font-weight:600;padding:10px 20px;border-radius:7px;">{{ boton }}</a>
    </td></tr>
    <tr><td style="padding:12px 22px;border-top:1px solid #CED4DA;font-size:12px;color:#566069;">
      Este aviso lo envió el sistema automáticamente; no respondas a este correo.
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
